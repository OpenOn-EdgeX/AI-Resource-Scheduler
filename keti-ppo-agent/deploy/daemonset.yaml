---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keti-ppo-agent
  namespace: edge-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: keti-ppo-agent
  namespace: edge-system
  labels:
    app: keti-ppo-agent
spec:
  selector:
    matchLabels:
      app: keti-ppo-agent
  template:
    metadata:
      labels:
        app: keti-ppo-agent
    spec:
      serviceAccountName: keti-ppo-agent
      # Edge 노드에만 배포
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/edge: ""
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/edge"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: ppo-agent
          image: ketidevit2/keti-ppo-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: API_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "INFO"
