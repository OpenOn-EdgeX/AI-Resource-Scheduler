---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ppo-agent
  namespace: scheduler-0324
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ppo-agent
  namespace: scheduler-0324
  labels:
    app: ppo-agent
spec:
  selector:
    matchLabels:
      app: ppo-agent
  template:
    metadata:
      labels:
        app: ppo-agent
    spec:
      serviceAccountName: ppo-agent
      # HostNetwork로 노드 IP:8081 직접 접근
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: ppo-agent
          image: ketidevit2/ppo-agent:latest-0324
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              hostPort: 8081
              name: http
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: API_PORT
              value: "8081"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: models
              mountPath: /app/models
            - name: nvidia-bin
              mountPath: /usr/bin/nvidia-smi
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: models
          emptyDir: {}
        - name: nvidia-bin
          hostPath:
            path: /usr/bin/nvidia-smi
            type: File
