apiVersion: batch/v1
kind: Job
metadata:
  name: workload-09
  namespace: scheduler-0324
  labels:
    group: mid-load
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: curlimages/curl:latest
          env:
            - name: SCHEDULER
              value: "http://ppo-agent.edge-system.svc.cluster.local:8080"
            - name: POD_NAME
              value: "workload-09"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[workload-09] /allocate 요청"
              curl -s -X POST $SCHEDULER/allocate \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-09","namespace":"scheduler-0324","requested_cores":40,"requested_memory":3072}'
              echo ""
              echo "[workload-09] 작업 시뮬레이션 (3s)"
              sleep 3
              echo "[workload-09] /feedback 전송"
              curl -s -X POST $SCHEDULER/feedback \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-09","allocated_cores":40,"allocated_memory":3072,"actual_performance":0.72,"completed":true}'
              echo ""
