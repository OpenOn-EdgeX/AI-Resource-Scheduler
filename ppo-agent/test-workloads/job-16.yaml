apiVersion: batch/v1
kind: Job
metadata:
  name: workload-16
  namespace: scheduler-0324
  labels:
    group: high-load
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: curlimages/curl:latest
          env:
            - name: SCHEDULER
              value: "http://ppo-agent.edge-system.svc.cluster.local:8080"
            - name: POD_NAME
              value: "workload-16"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[workload-16] /allocate 요청"
              curl -s -X POST $SCHEDULER/allocate \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-16","namespace":"scheduler-0324","requested_cores":100,"requested_memory":8192}'
              echo ""
              echo "[workload-16] 작업 시뮬레이션 (3s)"
              sleep 3
              echo "[workload-16] /feedback 전송"
              curl -s -X POST $SCHEDULER/feedback \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-16","allocated_cores":100,"allocated_memory":8192,"actual_performance":0.55,"completed":false}'
              echo ""
