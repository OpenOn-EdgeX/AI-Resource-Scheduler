apiVersion: batch/v1
kind: Job
metadata:
  name: workload-19
  namespace: scheduler-0324
  labels:
    group: high-load
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: curlimages/curl:latest
          env:
            - name: SCHEDULER
              value: "http://ppo-agent.edge-system.svc.cluster.local:8080"
            - name: POD_NAME
              value: "workload-19"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[workload-19] /allocate 요청"
              curl -s -X POST $SCHEDULER/allocate \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-19","namespace":"scheduler-0324","requested_cores":70,"requested_memory":4096}'
              echo ""
              echo "[workload-19] 작업 시뮬레이션 (3s)"
              sleep 3
              echo "[workload-19] /feedback 전송"
              curl -s -X POST $SCHEDULER/feedback \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-19","allocated_cores":70,"allocated_memory":4096,"actual_performance":0.60,"completed":false}'
              echo ""
