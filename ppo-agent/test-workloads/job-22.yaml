apiVersion: batch/v1
kind: Job
metadata:
  name: workload-22
  namespace: scheduler-0324
  labels:
    group: high-success
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: curlimages/curl:latest
          env:
            - name: SCHEDULER
              value: "http://ppo-agent.edge-system.svc.cluster.local:8080"
            - name: POD_NAME
              value: "workload-22"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[workload-22] /allocate 요청"
              curl -s -X POST $SCHEDULER/allocate \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-22","namespace":"scheduler-0324","requested_cores":90,"requested_memory":4096}'
              echo ""
              echo "[workload-22] 작업 시뮬레이션 (3s)"
              sleep 3
              echo "[workload-22] /feedback 전송"
              curl -s -X POST $SCHEDULER/feedback \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-22","allocated_cores":90,"allocated_memory":4096,"actual_performance":0.72,"completed":true}'
              echo ""
