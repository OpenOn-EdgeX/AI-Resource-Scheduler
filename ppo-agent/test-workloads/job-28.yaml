apiVersion: batch/v1
kind: Job
metadata:
  name: workload-28
  namespace: scheduler-0324
  labels:
    group: overload
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: curlimages/curl:latest
          env:
            - name: SCHEDULER
              value: "http://ppo-agent.edge-system.svc.cluster.local:8080"
            - name: POD_NAME
              value: "workload-28"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[workload-28] /allocate 요청"
              curl -s -X POST $SCHEDULER/allocate \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-28","namespace":"scheduler-0324","requested_cores":90,"requested_memory":6144}'
              echo ""
              echo "[workload-28] 작업 시뮬레이션 (3s)"
              sleep 3
              echo "[workload-28] /feedback 전송"
              curl -s -X POST $SCHEDULER/feedback \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-28","allocated_cores":90,"allocated_memory":6144,"actual_performance":0.48,"completed":false}'
              echo ""
