apiVersion: batch/v1
kind: Job
metadata:
  name: workload-32
  namespace: scheduler-0324
  labels:
    group: recovery
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: curlimages/curl:latest
          env:
            - name: SCHEDULER
              value: "http://ppo-agent.edge-system.svc.cluster.local:8080"
            - name: POD_NAME
              value: "workload-32"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[workload-32] /allocate 요청"
              curl -s -X POST $SCHEDULER/allocate \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-32","namespace":"scheduler-0324","requested_cores":20,"requested_memory":512}'
              echo ""
              echo "[workload-32] 작업 시뮬레이션 (3s)"
              sleep 3
              echo "[workload-32] /feedback 전송"
              curl -s -X POST $SCHEDULER/feedback \
                -H "Content-Type: application/json" \
                -d '{"pod_name":"workload-32","allocated_cores":20,"allocated_memory":512,"actual_performance":0.95,"completed":true}'
              echo ""
